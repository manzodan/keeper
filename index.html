<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="main.css">
    <title>Fantasy Football Keeper League Draft Simulator</title>
    <link rel="icon" type="image/ico" href="http://trevorpostma.com/keeper/football.ico">
</head>
<body>
    <div class="page-shell">
        <header class="topbar">
            <div class="brand-wrap">
                <div class="brand-mark">K</div>
                <div>
                    <p class="eyebrow">Fantasy Football</p>
                    <h1>Keeper Draft Simulator</h1>
                </div>
            </div>
            <nav class="topnav" aria-label="Main navigation">
                <a href="./index.html">Home</a>
            </nav>
        </header>

        <main class="app-shell">
            <section class="panel intro-panel">
                <p id="instructions">Configure your draft.</p>
            </section>

            <form id="form" class="panel config-panel">
                <p class="preset-link"><a href="javascript:void(0)" onclick="config('rox17')" id="rox17">Use Rox17 keeper presets</a></p>
                <div class="select-row">
                    <label class="field-label" for="configKeepers">Keepers per team</label>
                    <select name="keepers" id="configKeepers" onchange="config()">
                        <option value="0">0</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                    </select>
                </div>
                <div class="select-row">
                    <label class="field-label" for="configTeams">Teams in the draft</label>
                    <select name="teams" id="configTeams" onchange="config()">
                        <option value="10">10</option>
                        <option value="12">12</option>
                    </select>
                </div>
                <div id="selectKeepers" class="keeper-picker"></div>
                <input type="button" onclick="configSubmit()" value="Start draft" id="startButton">
            </form>

            <div class="draft-board">
                <div id="players" class="panel list-panel"></div>
                <div id="teams" class="teams-panel"></div>
            </div>
        </main>
    </div>
    <script type="text/javascript" src="./draft.js"></script>
</body>
</html>
